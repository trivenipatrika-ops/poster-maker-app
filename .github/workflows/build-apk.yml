name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Code checkout karein
        uses: actions/checkout@v4

      - name: Buildozer cache karein
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
          key: buildozer-docker-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-docker-

      - name: APK build karein (network gadbadi par 3 baar dobara koshish)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          command: buildozer android debug

      - name: APK ko artifact ke roop me save karein
        uses: actions/upload-artifact@v4
        with:
          name: poster-maker-pro-apk
          path: bin/*.apk
